{% extends 'base.html' %}
{% block titulo %}Código QR | Huellitas{% endblock %}
{% block contenido %}
<section class="container py-5">
  <div class="card shadow-sm p-4 mx-auto text-center" style="max-width: 480px;">
    <h1 class="h3">Código QR de {{ alumno.nombre }}</h1>
    <p>Escanea este código con tu celular para consultar la ficha pública de la mascota.</p>
    <img src="data:image/png;base64,{{ qr }}" alt="Código QR de {{ alumno.nombre }}" class="img-fluid mx-auto" style="width: 260px; max-width: 100%;">
    <p class="small text-muted mt-3">{{ direccion }}</p>
    <div class="d-flex gap-2 justify-content-center flex-wrap">
      <a class="btn btn-coral" href="{{ url_for('ficha_qr', id=alumno._id) }}">Abrir ficha</a>
      <a class="btn btn-outline-secondary" href="{{ url_for('ver_mascota', id=alumno._id) }}">Regresar</a>
    </div>
  </div>
</section>
{% endblock %}
