{% extends 'base.html' %}
{% block titulo %}Editar solicitud | Huellitas{% endblock %}
{% block contenido %}
<section class="container py-5"><div class="edit-request-card"><a class="back-link" href="{{ url_for('ver_solicitud', id=solicitud._id) }}" data-volver>← Cancelar</a><h1 class="h2 mt-3 mb-4">Editar solicitud</h1>
<form method="post" action="{{ url_for('editar_solicitud', id=solicitud._id) }}" class="row g-3">
  <div class="col-md-6"><label class="form-label" for="nombre_solicitante">Nombre del solicitante</label><input class="form-control" id="nombre_solicitante" name="nombre_solicitante" value="{{ solicitud.nombre_solicitante }}" required maxlength="100"></div>
  <div class="col-md-6"><label class="form-label" for="contacto">Teléfono o correo</label><input class="form-control" id="contacto" name="contacto" value="{{ solicitud.contacto }}" required maxlength="120"></div>
  <div class="col-12"><label class="form-label" for="estado">Estado de la solicitud</label><select class="form-select" id="estado" name="estado">{% for estado in ['Pendiente','En revisión','Aprobada','Rechazada'] %}<option value="{{ estado }}" {% if solicitud.estado == estado %}selected{% endif %}>{{ estado }}</option>{% endfor %}</select></div>
  <div class="col-12"><label class="form-label" for="mensaje">Mensaje</label><textarea class="form-control" id="mensaje" name="mensaje" rows="4" maxlength="1000">{{ solicitud.get('mensaje','') }}</textarea></div>
  <div class="col-12"><button class="btn btn-coral" type="submit">Guardar cambios</button></div>
</form></div></section>
{% endblock %}
