<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#176b57">
  <title>{% block titulo %}Huellitas | Casa de adopción{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap/css/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark navbar-huellitas sticky-top">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2" href="{{ url_for('inicio') }}">
      <span class="brand-icon">🐾</span><span>Huellitas <small>Casa de adopción</small></span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menú">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menuPrincipal">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
        <li class="nav-item"><a class="nav-link" href="{{ url_for('inicio') }}">Inicio</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('inicio') }}#catalogo">Mascotas</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('inicio') }}#registro">Administrar</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('ayuda') }}">Ayuda</a></li>
        <li class="nav-item"><a class="nav-link cart-link" href="{{ url_for('carrito') }}">♡ Solicitudes <span class="cart-count" id="cartCount">0</span></a></li>
        <li class="nav-item"><a class="btn btn-light btn-sm login-nav" href="{{ url_for('login') }}">Iniciar sesión</a></li>
      </ul>
    </div>
  </div>
</nav>
<main>{% block contenido %}{% endblock %}</main>
<footer class="footer-huellitas">
  <div class="container d-flex flex-column flex-md-row justify-content-between gap-2">
    <span><strong>Huellitas</strong> · Cada mascota merece un hogar.</span>
    <span>Proyecto escolar · Casa de Adopción de Mascotas</span>
  </div>
</footer>
<script src="{{ url_for('static', filename='bootstrap/js/bootstrap.bundle.min.js') }}"></script>
<script>
(function () {
  function getCart() {
    try { return JSON.parse(localStorage.getItem('huellitasCart') || '[]'); }
    catch (e) { return []; }
  }
  function updateCount() {
    var count = document.getElementById('cartCount');
    if (count) count.textContent = getCart().length;
  }
  window.huellitasCart = {
    get: getCart,
    add: function(pet) {
      var cart = getCart();
      if (!cart.some(function(item) { return item.id === pet.id; })) cart.push(pet);
      localStorage.setItem('huellitasCart', JSON.stringify(cart));
      updateCount();
    },
    remove: function(id) {
      localStorage.setItem('huellitasCart', JSON.stringify(getCart().filter(function(item) { return item.id !== id; })));
      updateCount();
    },
    clear: function() {
      localStorage.removeItem('huellitasCart');
      updateCount();
    }
  };
  updateCount();
})();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
